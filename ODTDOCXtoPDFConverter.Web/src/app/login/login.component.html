<h1>Login</h1>

<form (ngSubmit)="login()">
    <div>
        <label for="username">UserName</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" autocomplete="username">
    </div>

    <div>
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" autocomplete="current-password">
    </div>

    <div>
        <button type="submit">Login</button>
    </div>
</form>
