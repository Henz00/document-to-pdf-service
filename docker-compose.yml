services:
  api:
    build:
      context: ./ODTDOCXtoPDFConverter.Api
    container_name: odtdocx-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RateLimiting__Enabled: "true"
    volumes:
      - identity-data:/app/data
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys

  web:
    build:
      context: ./ODTDOCXtoPDFConverter.Web
    container_name: odtdocx-web
    restart: unless-stopped
    ports:
      - "127:0.0.1:4200:80"
    depends_on:
      - api

volumes:
  identity-data:
  dataprotection-keys: